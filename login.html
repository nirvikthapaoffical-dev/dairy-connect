
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dairy Connect | Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#101b16;
    color:#fff;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:420px;
    background:#192820;
    border:1px solid #304638;
    border-radius:18px;
    padding:35px;
}
.logo{font-size:25px;font-weight:bold;letter-spacing:2px}
.logo span{color:#79c69b}
.subtitle{color:#a7b6ac;margin:12px 0 30px}
label{display:block;margin:18px 0 8px;font-size:14px}
input{
    width:100%;
    padding:14px;
    border:1px solid #40564a;
    background:#101b16;
    color:white;
    border-radius:8px;
    outline:none;
}
input:focus{border-color:#79c69b}
button{
    width:100%;
    margin-top:24px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#79c69b;
    color:#102018;
    font-weight:bold;
    cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
#message{margin-top:18px;font-size:14px;line-height:1.5}
.back{display:block;margin-top:22px;text-align:center;color:#a7b6ac;text-decoration:none;font-size:13px}
</style>
</head>
<body>

<div class="container">
    <div class="logo">DAIRY<span> CONNECT.</span></div>
    <p class="subtitle">Sign in to your Dairy Connect account.</p>

    <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>

        <button id="loginButton" type="submit">Sign In</button>
    </form>

    <p id="message" role="status"></p>
    <a class="back" href="./index.html">← Back to home</a>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        const user = data.user;

        const { data: profile, error: profileError } = await supabase
            .from("profiles")
            .select("role, full_name")
            .eq("id", user.id)
            .single();

        if (profileError) {
            await supabase.auth.signOut();
            throw new Error("Your profile could not be loaded. Contact the administrator.");
        }

        message.textContent = "Welcome, " + profile.full_name + "!";

        const destinations = {
            admin: "./company.html",
            farmer: "./farmer.html",
            customer: "./customer.html",
            driver: "./delivery.html"
        };

        const destination = destinations[profile.role];

        if (!destination) {
            await supabase.auth.signOut();
            throw new Error("Your account does not have a valid portal role.");
        }

        window.location.href = destination;

    } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Sign In";
    }
});
</script>

</body>
</html>
